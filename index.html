<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單字勇者：記憶宮殿鍛造記</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: #161b22;
      --card-bg: #21262d;
      --accent: #ff4757;
      --gold: #ffa502;
      --green: #2ed573;
      --blue: #1e90ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 520px;
      height: 100vh;
      height: 100dvh;
      max-height: 920px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* 頂部宮殿導航 */
    header {
      background: #121820;
      border-bottom: 2px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 2;
    }
    .palace-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    select.chapter-dropdown {
      background: #21262d;
      color: var(--gold);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.95rem;
      outline: none;
      max-width: 72vw;
    }
    .stage-list-toggle-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #090d12;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1e90ff, #2ed573);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 關卡抽屜選擇器 (可回溯重刷) */
    #stage-drawer {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      background: rgba(18, 24, 32, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border);
      padding: 12px;
      z-index: 9;
      display: none;
      flex-direction: column;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .drawer-title {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .stage-nodes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stage-node-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      color: var(--text);
      font-size: 0.75rem;
      transition: all 0.15s;
    }
    .stage-node-btn img { width: 40px; height: 40px; object-fit: contain; }
    .stage-node-btn.cleared { opacity: 0.5; background: #11151a; border-color: #262c36; }
    .stage-node-btn.current { border-color: var(--gold); background: rgba(255, 165, 2, 0.15); opacity: 1; }

    /* 場景區域 */
    .scene-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* 戰鬥面板 */
    #battle-scene {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      height: 100%;
      overflow-y: auto;
    }

    /* ---------- 橫向捲軸冒險舞台 ---------- */
    .arena {
      position: relative; flex: none;
      width: 100%; height: clamp(190px, 34vh, 300px);
      border-radius: 12px; overflow: hidden; isolation: isolate;
      border: 2px solid var(--border); background: #24324a;
    }
    .arena-bg {
      position: absolute; inset: 0; z-index: 0;
      background-repeat: repeat-x; background-size: auto 100%; background-position: 0 0;
    }
    .arena-bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(rgba(0,0,0,.35), transparent 30%, transparent 75%, rgba(0,0,0,.25));
    }
    .arena-hud {
      position: absolute; top: 6px; left: 0; right: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
    }
    .stage-badge {
      font-size: 0.75rem; color: #fff; margin-bottom: 4px; font-weight: 700;
      background: rgba(0,0,0,.45); padding: 1px 10px; border-radius: 99px;
    }
    .stage-badge.repeat-tag { color: #7fe3dc; }
    .stage-badge.boss-tag { color: #ffcf4a; }
    .enemy-hp-container {
      width: 180px; height: 14px; background: #000; border-radius: 8px; overflow: hidden;
      border: 1.5px solid #485460; position: relative;
    }
    .enemy-hp-fill {
      height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81);
      width: 100%; transition: width 0.25s ease-out;
    }
    .enemy-hp-num {
      position: absolute; width: 100%; text-align: center; top: 0; left: 0;
      font-size: 0.65rem; line-height: 14px; font-weight: bold; color: #fff;
    }
    .hero-sprite, .enemy-sprite {
      position: absolute; bottom: 7%; z-index: 2; object-fit: contain; aspect-ratio: 1 / 1;
      transform-origin: 50% 90%; filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .45));
    }
    .hero-sprite { left: 3%; width: 36%; max-width: 170px; }
    .enemy-sprite { right: 4%; width: 32%; max-width: 150px; animation: breathe 1.6s infinite ease-in-out; }
    .enemy-sprite.boss { width: 42%; max-width: 200px; filter: drop-shadow(0 0 14px rgba(255, 80, 60, .75)); }
    .enemy-sprite.hidden { opacity: 0; }
    .arena.running .hero-sprite { animation: run .3s infinite alternate ease-in-out; }
    .hero-sprite { animation: breathe 1.8s infinite ease-in-out; }
    @keyframes run { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-9%) rotate(3deg); } }
    @keyframes breathe { 50% { transform: scale(1.03, .97); } }
    .hero-lv {
      position: absolute; left: 4%; bottom: 2%; z-index: 3; pointer-events: none;
      font-size: .7rem; font-weight: 800; color: #ffcf4a;
      background: rgba(0,0,0,.55); padding: 1px 8px; border-radius: 99px;
    }

    /* 打擊特效 */
    .fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
    .fx-spark {
      position: absolute; width: 12px; height: 12px; background: #fff3a0;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      box-shadow: 0 0 8px #ffb300;
    }
    .fx-hit { position: absolute; width: 120px; }
    .fx-smoke { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(240, 240, 240, .9); }
    .fx-text {
      position: absolute; white-space: nowrap; font-weight: 900; font-family: "Arial Black", Impact, sans-serif;
      font-size: 1.6rem; color: #ff3b2f; -webkit-text-stroke: 2px #fff; paint-order: stroke fill;
      text-shadow: 0 3px 0 #7a0d06;
    }
    .fx-text.crit { font-size: 2.1rem; color: #ffcf1f; text-shadow: 0 3px 0 #b5410a; }
    .fx-text.ouch { color: #fff; -webkit-text-stroke: 2px #c62828; font-size: 1.3rem; }

    /* 勇者裝備列 */
    .player-stats-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      width: 100%; padding: 6px 12px;
      background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .player-stats-bar b { color: var(--gold); }

    /* 拼字作答槽 */
    .puzzle-center { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .chinese-bubble {
      font-size: 1.35rem; font-weight: 800; color: #70a1ff; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .say-btn {
      background: rgba(255,255,255,.1); border: 1px solid var(--border); color: #fff;
      border-radius: 99px; padding: 2px 10px; font-size: .9rem; cursor: pointer;
    }
    .slots-box { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 52px; }
    .slot {
      width: 42px; height: 48px;
      background: var(--card-bg); border: 2px solid var(--border); border-bottom: 3.5px solid #747d8c; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 900; color: #fff; text-transform: uppercase; cursor: pointer;
    }
    .slot.active { border-color: #70a1ff; }
    .slot.filled { border-bottom-color: var(--green); color: var(--green); }
    .hint-line {
      min-height: 1.4em; margin-top: 6px; font-size: .9rem; font-weight: 700; color: #ffcf4a; text-align: center;
    }

    /* 亂序字母按鈕池 */
    .letters-grid {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      max-width: 360px; margin-bottom: 4px;
    }
    .letter-key {
      width: 48px; height: 50px;
      background: #2f3542; border: 1px solid #57606f; border-bottom: 4px solid #1e272e; border-radius: 8px;
      color: #fff; font-size: 1.35rem; font-weight: 900; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .letter-key.used { opacity: 0.15; pointer-events: none; transform: translateY(3px); border-bottom: 1px solid #1e272e; }
    .letter-key.glow { animation: glow .5s 3 alternate; border-color: #ffcf4a; }
    @keyframes glow { to { background: #b8860b; box-shadow: 0 0 16px #ffcf4a; transform: scale(1.12); } }

    /* 文法題 */
    .grammar-panel { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .grammar-panel[hidden] { display: none; }
    .q-en { font-size: 1.35rem; font-weight: 900; color: #fff; text-align: center; line-height: 1.3; }
    .options { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: #2f3542; border: 1px solid #57606f; border-bottom: 4px solid #1e272e; border-radius: 10px;
      color: #fff; padding: 9px 12px; cursor: pointer; font: inherit;
    }
    .opt .letter {
      flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      background: #1e272e; font-weight: 900; color: var(--gold);
    }
    .opt .en { font-size: 1.05rem; font-weight: 800; display: block; }
    .opt .zh { font-size: .8rem; color: var(--text-dim); display: block; margin-top: 2px; }
    .opt .zh[hidden] { display: none; }
    .opt.right { background: #1f5f3a; border-color: var(--green); }
    .opt.wrong { background: #5c1f26; border-color: var(--accent); opacity: .75; }
    .opt:disabled { cursor: default; }

    /* 鍛造工坊面板 */
    #forge-scene { display: none; flex-direction: column; padding: 14px; height: 100%; overflow-y: auto; }
    .anvil-banner {
      background: linear-gradient(145deg, #1e272e, #13171c);
      border: 2px dashed #485460; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 14px;
    }
    .anvil-icon { font-size: 2.8rem; }
    .forge-preview { margin: 10px 0; min-height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .forge-preview img { width: 72px; height: 72px; object-fit: contain; }
    .forge-cta-btn {
      background: linear-gradient(90deg, #ffa502, #ff7f50); color: #000; border: none;
      padding: 10px 24px; border-radius: 20px; font-size: 1rem; font-weight: 900; cursor: pointer;
    }
    .forge-cta-btn:disabled { background: #485460; color: #808e9b; cursor: not-allowed; }
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 20px; }
    .word-card {
      background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 8px;
      padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
    }
    .word-card.picked { border-color: var(--gold); background: rgba(255, 165, 2, 0.1); }
    .word-card .card-w { font-weight: 800; color: #70a1ff; }
    .word-card .card-ch { font-size: 0.8rem; color: var(--text-dim); }

    /* 結算開箱、勇者進化 Modal */
    .modal-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; z-index: 10; text-align: center;
    }
    .chest-graphic { font-size: 5rem; cursor: pointer; animation: chestHop 0.8s infinite alternate ease-in-out; }
    @keyframes chestHop { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
    .loot-card { text-align: center; display: none; }
    .btn-action {
      background: var(--green); color: #fff; border: none;
      padding: 10px 24px; border-radius: 20px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 15px;
    }
    .evolve-img {
      width: min(60vw, 220px); aspect-ratio: 1; object-fit: contain;
      filter: drop-shadow(0 0 22px #ffcf4a); animation: evolve .9s ease-out;
    }
    @keyframes evolve {
      0% { transform: scale(.3) rotate(-20deg); filter: brightness(4) drop-shadow(0 0 40px #fff); opacity: 0; }
      60% { transform: scale(1.15) rotate(4deg); filter: brightness(1.6) drop-shadow(0 0 30px #ffcf4a); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* 底部導覽欄 */
    nav { height: 52px; background: #121820; border-top: 2px solid var(--border); display: flex; flex: none; }
    nav button {
      flex: 1; background: transparent; border: none; color: var(--text-dim);
      font-size: 0.85rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    nav button.active { color: var(--gold); background: var(--panel-bg); border-top: 3px solid var(--gold); }
    /* 窄螢幕時，左下角有網站共用的「遊戲樂園」按鈕（118px 寬），導覽列讓出位置 */
    @media (max-width: 780px) {
      nav { padding-left: 134px; height: 54px; }
      nav button { flex-direction: column; gap: 0; font-size: .72rem; line-height: 1.2; }
    }

    @media (max-height: 700px) {
      .arena { height: clamp(170px, 30vh, 240px); }
      .letter-key { width: 44px; height: 46px; }
      .slot { width: 38px; height: 44px; }
      .chinese-bubble { margin-bottom: 4px; }
    }
    @media (max-height: 520px) {
      .arena { height: 140px; }
      #battle-scene { justify-content: flex-start; gap: 6px; padding: 6px 10px; }
      .player-stats-bar { padding: 3px 10px; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 頂部宮殿導覽 -->
  <header>
    <div class="palace-bar">
      <select id="chapter-dropdown" class="chapter-dropdown" onchange="onChapterChange(this.value)"></select>
      <button class="stage-list-toggle-btn" id="btn-toggle-drawer">🗺️ 關卡清單</button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="palace-progress"></div>
    </div>
  </header>

  <!-- 關卡清單抽屜（支援回溯重刷） -->
  <div id="stage-drawer">
    <div class="drawer-title">
      <span>點選關卡可直接回顧挑戰 (已攻克無掉落)</span>
      <span id="drawer-stats" style="color:var(--gold);">0 / 0</span>
    </div>
    <div class="stage-nodes-grid" id="stage-nodes-container"></div>
  </div>

  <!-- 場景切換區 -->
  <div class="scene-view">
    <!-- 戰鬥場景 -->
    <div id="battle-scene">
      <div class="arena" id="arena">
        <div class="arena-bg" id="arena-bg"></div>
        <div class="arena-hud">
          <div class="stage-badge" id="ui-stage-tag">關卡 1-1</div>
          <div class="enemy-hp-container">
            <div class="enemy-hp-fill" id="enemy-hp-bar"></div>
            <div class="enemy-hp-num" id="enemy-hp-text">100 / 100</div>
          </div>
        </div>
        <img class="hero-sprite" id="hero-img" src="assets/rpg/hero-1.webp" alt="勇者">
        <img class="enemy-sprite hidden" id="enemy-avatar" alt="怪物">
        <div class="hero-lv" id="hero-lv">Lv.1 初階冒險者</div>
        <div class="fx" id="fx"></div>
      </div>

      <div class="player-stats-bar">
        <div>🗡️ <b id="ui-weap-name">初心木劍</b></div>
        <div>💥 傷: <b id="ui-weap-atk">20</b></div>
        <div>⏳ 餘: <b id="ui-weap-dur">∞</b></div>
      </div>

      <!-- 單字拼字 -->
      <div class="puzzle-center" id="word-panel">
        <div class="chinese-bubble"><span id="puzzle-cn">載入題庫中...</span><button class="say-btn" id="btn-say-word" title="聽發音">🔊</button></div>
        <div class="slots-box" id="puzzle-slots"></div>
        <div class="hint-line" id="hint-line"></div>
      </div>
      <div class="pool-area" id="pool-area">
        <div class="letters-grid" id="pool-grid"></div>
      </div>

      <!-- 文法選擇題 -->
      <div class="grammar-panel" id="grammar-panel" hidden>
        <div class="chinese-bubble"><span class="q-en" id="q-en"></span><button class="say-btn" id="btn-say-q" title="再聽一次">🔊</button></div>
        <div class="hint-line" id="q-hint"></div>
        <div class="options" id="q-options"></div>
      </div>
    </div>

    <!-- 鐵砧工坊場景 -->
    <div id="forge-scene">
      <div class="anvil-banner">
        <div class="anvil-icon">⚒️</div>
        <h3 style="color: var(--gold);">字母鐵砧工坊</h3>
        <p style="font-size: 0.75rem; color: var(--text-dim); margin-top: 4px;">
          注入單字淬火為武器（已鍛造的單字素材將會消耗消失）<br>單字越長，武器越強，勇者也會換上更帥的裝備！
        </p>
        <div class="forge-preview" id="forge-preview-box">
          <span style="font-size: 0.85rem; color: #888;">請在下方背包選擇單字素材</span>
        </div>
        <button class="forge-cta-btn" id="forge-exec-btn" disabled>開始淬火鍛造</button>
      </div>

      <div style="font-size:0.85rem; color:var(--text-dim); margin-bottom:8px; display:flex; justify-content:space-between;">
        <span>🎒 單字素材背包</span>
        <span>總數: <b id="ui-bag-count" style="color:var(--gold);">0</b></span>
      </div>
      <div class="cards-grid" id="inventory-cards"></div>
    </div>
  </div>

  <!-- 結算開箱 Modal -->
  <div class="modal-overlay" id="loot-modal">
    <!-- 首通寶箱 -->
    <div class="chest-graphic" id="chest-clicker">🎁</div>
    <p id="chest-tip" style="color: #fff; margin-top: 10px; font-weight: bold;">首通領主！點擊寶箱領取單字！</p>

    <!-- 首通卡片展示 -->
    <div class="loot-card" id="loot-details">
      <h2 style="color: var(--gold); margin-bottom: 6px;">🎉 首通獲得新單字素材！</h2>
      <div id="loot-word-title" style="font-size: 1.8rem; font-weight: 900; color: #70a1ff;">APPLE</div>
      <div id="loot-word-cn" style="color: #ccc; margin-bottom: 8px;">蘋果</div>
      <p style="font-size: 0.8rem; color: var(--green);">★ 已收錄至鐵砧背包，可鑄造兵器！</p>
      <button class="btn-action" id="btn-next-round">前往下一關</button>
    </div>

    <!-- 複習重刷無掉落展示 -->
    <div class="loot-card" id="repeat-clear-details">
      <h2 style="color: #38ada9; margin-bottom: 6px;">⚔️ 複習討伐成功！</h2>
      <div id="repeat-word-title" style="font-size: 1.8rem; font-weight: 900; color: #70a1ff;">APPLE</div>
      <p style="font-size: 0.85rem; color: #bbb; margin-top: 6px;">本關卡先前已領取過單字獎勵。<br>（複習模式不重複掉落素材）</p>
      <button class="btn-action" id="btn-repeat-next">繼續下一關</button>
    </div>
  </div>

  <!-- 勇者進化 Modal -->
  <div class="modal-overlay" id="evolve-modal">
    <h2 style="color: var(--gold); margin-bottom: 8px;">✨ 勇者進化！</h2>
    <img class="evolve-img" id="evolve-img" alt="">
    <div id="evolve-name" style="font-size: 1.4rem; font-weight: 900; color: #ffcf4a; margin-top: 8px;"></div>
    <p id="evolve-reason" style="font-size: 0.85rem; color: #ccc; margin-top: 6px;"></p>
    <button class="btn-action" id="btn-evolve-ok">太帥了！繼續冒險</button>
  </div>

  <!-- 底部導覽 -->
  <nav>
    <button id="nav-btn-fight" class="active">⚔️ 單字討伐</button>
    <button id="nav-btn-grammar">📜 文法討伐</button>
    <button id="nav-btn-forge">⚒️ 鐵砧鍛造</button>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/rpg/juice.js"></script>
<script>
  /* ========================================================
     1. 記憶宮殿與關卡資料 (每詞皆為獨立關卡；每殿最後一關是魔王)
     ======================================================== */
  const PALACES = [
    {
      id: 1,
      name: "🏰 第一殿：晨曦森林",
      diff: "3~4 字母",
      sheet: "forest",
      bg: "assets/rpg/bg-forest.webp",
      stages: [
        { id: "1-1", word: "CAT", ch: "貓咪" },
        { id: "1-2", word: "DOG", ch: "小狗" },
        { id: "1-3", word: "PIG", ch: "小豬" },
        { id: "1-4", word: "SUN", ch: "太陽" },
        { id: "1-5", word: "RED", ch: "紅色" },
        { id: "1-6", word: "BUS", ch: "公車" },
        { id: "1-7", word: "HAT", ch: "帽子" }
      ]
    },
    {
      id: 2,
      name: "🌊 第二殿：珊瑚秘境",
      diff: "4~5 字母",
      sheet: "coral",
      bg: "assets/hero/bg-coral.webp",
      stages: [
        { id: "2-1", word: "FISH", ch: "魚" },
        { id: "2-2", word: "BLUE", ch: "藍色" },
        { id: "2-3", word: "MILK", ch: "牛奶" },
        { id: "2-4", word: "BIRD", ch: "鳥" },
        { id: "2-5", word: "DUCK", ch: "鴨子" },
        { id: "2-6", word: "BEAR", ch: "熊" }
      ]
    },
    {
      id: 3,
      name: "🏫 第三殿：校園工坊",
      diff: "5~6 字母",
      sheet: "school",
      bg: "assets/hero/bg-school.webp",
      stages: [
        { id: "3-1", word: "APPLE", ch: "蘋果" },
        { id: "3-2", word: "WATER", ch: "水" },
        { id: "3-3", word: "CHAIR", ch: "椅子" },
        { id: "3-4", word: "RULER", ch: "尺" },
        { id: "3-5", word: "PENCIL", ch: "鉛筆" },
        { id: "3-6", word: "BANANA", ch: "香蕉" }
      ]
    },
    {
      id: 4,
      name: "🌋 第四殿：熾熱山脈",
      diff: "6~7 字母",
      sheet: "volcano",
      bg: "assets/rpg/bg-canyon.webp",
      stages: [
        { id: "4-1", word: "ORANGE", ch: "柳橙" },
        { id: "4-2", word: "YELLOW", ch: "黃色" },
        { id: "4-3", word: "MONKEY", ch: "猴子" },
        { id: "4-4", word: "RABBIT", ch: "兔子" },
        { id: "4-5", word: "SCHOOL", ch: "學校" }
      ]
    },
    {
      id: 5,
      name: "🌌 第五殿：銀河神殿",
      diff: "7~8 字母",
      sheet: "galaxy",
      bg: "assets/rpg/bg-wasteland.webp",
      stages: [
        { id: "5-1", word: "MORNING", ch: "早晨" },
        { id: "5-2", word: "TEACHER", ch: "老師" },
        { id: "5-3", word: "STUDENT", ch: "學生" },
        { id: "5-4", word: "ELEPHANT", ch: "大象" }
      ]
    }
  ];

  // 文法神殿：題目來自 js/data.js 的 9 個句型單元
  const GRAMMAR_IDX = PALACES.length;
  PALACES.push({
    id: 6,
    name: "📜 第六殿：文法神殿",
    diff: "句型對話",
    sheet: "grammar",
    bg: "assets/rpg/bg-factory.webp",
    grammar: true,
    stages: (window.GAME_DATA ? GAME_DATA.sentence : []).map((u, i) => ({
      id: `G-${i + 1}`, name: u.name, ch: u.name, unit: u
    }))
  });

  // 怪物圖：每座宮殿一張 3x3 怪物圖切成 9 隻，第 9 隻是魔王
  function monsterImg(palace, idx) {
    const n = idx === palace.stages.length - 1 ? 9 : Math.min(idx + 1, 8);
    return `assets/hero/m-${palace.sheet}-${n}.webp`;
  }
  const isBossStage = (palace, idx) => idx === palace.stages.length - 1;

  /* ========================================================
     2. 遊戲狀態與存檔
     ======================================================== */
  let currentPalaceIdx = 0;
  let lastWordPalaceIdx = 0;
  let currentStageIdx = 0;
  let curStage = null;
  let inputLetters = [];
  let enemyMaxHp = 100;
  let enemyCurHp = 100;
  let comboCount = 0;
  let inputLocked = true;
  let runToken = 0;
  let wrongAtPos = 0;
  let grammarQueue = [];
  let curQ = null;
  let pendingLoot = null;

  // 核心：已攻克關卡 ID 集合 (用於消掉與防止二次領取)
  let clearedStageKeys = new Set();

  let playerWeapon = { name: "初心木劍", atk: 20, durability: Infinity };
  let wordBag = [];
  let forgeCandidateIdx = null;

  function loadGameSave() {
    try {
      const pIdx = localStorage.getItem("word_hero_palace");
      const cKeys = localStorage.getItem("word_hero_cleared_stages");
      const bag = localStorage.getItem("word_hero_bag");
      const weap = localStorage.getItem("word_hero_weap");
      const lastWord = localStorage.getItem("word_hero_last_word_palace");

      if (pIdx !== null) currentPalaceIdx = Math.min(parseInt(pIdx) || 0, PALACES.length - 1);
      if (lastWord !== null) lastWordPalaceIdx = Math.min(parseInt(lastWord) || 0, GRAMMAR_IDX - 1);
      if (cKeys !== null) clearedStageKeys = new Set(JSON.parse(cKeys));
      if (bag !== null) wordBag = JSON.parse(bag);
      if (weap !== null) playerWeapon = JSON.parse(weap);
      // JSON 存不了 Infinity（會變成 null），讀回來時還原成無限耐久
      if (playerWeapon.durability == null) playerWeapon.durability = Infinity;
    } catch(e) {}
  }

  function saveGameProgress() {
    try {
      localStorage.setItem("word_hero_palace", currentPalaceIdx);
      localStorage.setItem("word_hero_last_word_palace", lastWordPalaceIdx);
      localStorage.setItem("word_hero_cleared_stages", JSON.stringify([...clearedStageKeys]));
      localStorage.setItem("word_hero_bag", JSON.stringify(wordBag));
      localStorage.setItem("word_hero_weap", JSON.stringify(playerWeapon));
    } catch(e) {}
  }

  /* ========================================================
     3. 音效與語音
     ======================================================== */
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  function playSynth(freq, wave, dur, gainVal = 0.1) {
    if (audioContext.state === "suspended") audioContext.resume();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, audioContext.currentTime);
    gain.gain.setValueAtTime(gainVal, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    osc.stop(audioContext.currentTime + dur);
  }

  function speakWord(text) {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(/^[A-Z]+$/.test(text) ? text.toLowerCase() : text);
      u.lang = "en-US";
      u.rate = 0.7;
      window.speechSynthesis.speak(u);
    }
  }

  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ========================================================
     4. 勇者造型：首通掉落（攻克關數）與鍛造武器都會讓勇者變身
     ======================================================== */
  const HERO_LV = ["", "Lv.1 初階冒險者", "Lv.2 見習勇者", "Lv.3 精英戰士", "Lv.4 傳奇大將"];
  const heroImgEl = document.getElementById("hero-img");
  const heroLvEl = document.getElementById("hero-lv");

  function clearTier() {
    const n = clearedStageKeys.size;
    return n >= 25 ? 4 : n >= 13 ? 3 : n >= 5 ? 2 : 1;
  }
  function weaponTier(w = playerWeapon) {
    if (w.durability === Infinity) return 1;
    return w.atk >= 105 ? 4 : w.atk >= 75 ? 3 : 2;
  }
  const heroTier = () => Math.max(clearTier(), weaponTier());
  let shownTier = 1;

  function refreshHero(reason) {
    const t = heroTier();
    heroImgEl.src = `assets/rpg/hero-${t}.webp`;
    heroLvEl.innerText = HERO_LV[t];
    if (reason && t > shownTier) showEvolve(t, reason);
    shownTier = t;
  }

  const evolveModalEl = document.getElementById("evolve-modal");
  function showEvolve(t, reason) {
    const img = document.getElementById("evolve-img");
    img.src = `assets/rpg/hero-${t}.webp`;
    img.style.animation = "none";
    void img.offsetWidth;
    img.style.animation = "";
    document.getElementById("evolve-name").innerText = HERO_LV[t];
    document.getElementById("evolve-reason").innerText = reason;
    evolveModalEl.style.display = "flex";
    playSynth(523, "triangle", 0.15, 0.2);
    setTimeout(() => playSynth(659, "triangle", 0.15, 0.2), 140);
    setTimeout(() => playSynth(1046, "triangle", 0.35, 0.2), 280);
  }
  document.getElementById("btn-evolve-ok").onclick = () => { evolveModalEl.style.display = "none"; };

  /* ========================================================
     5. 關卡切換、抽屜清單與選關
     ======================================================== */
  const chapterDropdown = document.getElementById("chapter-dropdown");
  const stageDrawerEl = document.getElementById("stage-drawer");
  const stageNodesContainer = document.getElementById("stage-nodes-container");
  const drawerStatsEl = document.getElementById("drawer-stats");
  const btnToggleDrawer = document.getElementById("btn-toggle-drawer");

  function setupChapterDropdown() {
    chapterDropdown.innerHTML = "";
    PALACES.forEach((palace, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.innerText = palace.name;
      if (idx === currentPalaceIdx) opt.selected = true;
      chapterDropdown.appendChild(opt);
    });
  }

  function onChapterChange(idx) {
    switchPalace(parseInt(idx));
  }

  function switchPalace(idx) {
    currentPalaceIdx = idx;
    if (idx !== GRAMMAR_IDX) lastWordPalaceIdx = idx;
    chapterDropdown.value = String(idx);
    findNextAvailableStageInPalace();
    saveGameProgress();
    updateNavActive();
    loadStage(currentStageIdx);
  }

  btnToggleDrawer.onclick = () => {
    const isShowing = stageDrawerEl.style.display === "flex";
    stageDrawerEl.style.display = isShowing ? "none" : "flex";
    if (!isShowing) renderStageDrawer();
  };

  // 繪製抽屜裡的關卡按鈕（攻克的會變暗消退，可點擊回顧重刷）
  function renderStageDrawer() {
    const palace = PALACES[currentPalaceIdx];
    stageNodesContainer.innerHTML = "";
    let clearedInThisPalace = 0;

    palace.stages.forEach((st, idx) => {
      const isCleared = clearedStageKeys.has(st.id);
      if (isCleared) clearedInThisPalace++;

      const btn = document.createElement("div");
      btn.className = `stage-node-btn ${isCleared ? 'cleared' : ''} ${idx === currentStageIdx ? 'current' : ''}`;
      btn.innerHTML = `
        <img src="${monsterImg(palace, idx)}" alt="">
        <span style="font-weight:bold;">${st.id}${isBossStage(palace, idx) ? ' 👑' : ''}</span>
        <span>${palace.grammar ? st.name : st.word}</span>
        <span>${isCleared ? '✅ 攻克' : '⚔️ 挑戰'}</span>
      `;
      btn.onclick = () => {
        stageDrawerEl.style.display = "none";
        loadStage(idx);
      };
      stageNodesContainer.appendChild(btn);
    });

    drawerStatsEl.innerText = `${clearedInThisPalace} / ${palace.stages.length}`;
    updatePalaceProgressBar();
  }

  function updatePalaceProgressBar() {
    const palace = PALACES[currentPalaceIdx];
    let clearedCount = palace.stages.filter(s => clearedStageKeys.has(s.id)).length;
    const pct = Math.min(100, (clearedCount / palace.stages.length) * 100);
    document.getElementById("palace-progress").style.width = pct + "%";
  }

  // 自動鎖定下一個未攻略的關卡
  function findNextAvailableStageInPalace() {
    const palace = PALACES[currentPalaceIdx];
    const firstUnfinished = palace.stages.findIndex(s => !clearedStageKeys.has(s.id));
    currentStageIdx = firstUnfinished !== -1 ? firstUnfinished : 0;
  }

  /* ========================================================
     6. 橫向捲軸：勇者跑步前進、怪物登場
     ======================================================== */
  const juice = window.RPG.juice;
  const HIT_IMG = "assets/rpg/ui-hit.webp";
  const gameBox = document.getElementById("game-container");
  const arenaEl = document.getElementById("arena");
  const arenaBgEl = document.getElementById("arena-bg");
  const fxEl = document.getElementById("fx");
  const enemyAvatarEl = document.getElementById("enemy-avatar");
  const enemyHpBarEl = document.getElementById("enemy-hp-bar");
  const enemyHpTextEl = document.getElementById("enemy-hp-text");
  const puzzleCnEl = document.getElementById("puzzle-cn");
  const puzzleSlotsEl = document.getElementById("puzzle-slots");
  const poolGridEl = document.getElementById("pool-grid");
  const uiStageTagEl = document.getElementById("ui-stage-tag");
  const hintLineEl = document.getElementById("hint-line");
  const wordPanelEl = document.getElementById("word-panel");
  const poolAreaEl = document.getElementById("pool-area");
  const grammarPanelEl = document.getElementById("grammar-panel");
  let bgOffset = 0;

  function centerOf(el) {
    const a = arenaEl.getBoundingClientRect();
    const b = el.getBoundingClientRect();
    return { x: b.left - a.left + b.width / 2, y: b.top - a.top + b.height * 0.45 };
  }

  // 背景往左捲動，看起來像勇者往右跑
  function scrollBackground(ms) {
    bgOffset += arenaEl.clientWidth * 0.9;
    arenaBgEl.style.transition = `background-position ${ms}ms linear`;
    arenaBgEl.style.backgroundPosition = `-${bgOffset}px 0`;
  }

  async function runToStage(token, isBoss) {
    inputLocked = true;
    enemyAvatarEl.getAnimations().forEach(a => a.cancel());
    enemyAvatarEl.classList.add("hidden");
    arenaEl.classList.add("running");
    scrollBackground(1100);
    await sleep(900);
    if (token !== runToken) return;
    enemyAvatarEl.classList.remove("hidden");
    if (isBoss) playSynth(110, "sawtooth", 0.5, 0.15);
    await juice.enter(enemyAvatarEl);
    if (token !== runToken) return;
    arenaEl.classList.remove("running");
    inputLocked = false;
    if (curStage && curStage.unit) speakWord(curQ.q);
  }

  /* ========================================================
     7. 戰鬥核心機制
     ======================================================== */
  function loadStage(stageIdx) {
    const palace = PALACES[currentPalaceIdx];
    curStage = palace.stages[stageIdx];
    currentStageIdx = stageIdx;
    const token = ++runToken;
    const boss = isBossStage(palace, stageIdx);

    const isClearedAlready = clearedStageKeys.has(curStage.id);
    uiStageTagEl.innerText = `${boss ? '👑 魔王 ' : '關卡 '}${curStage.id}${palace.grammar ? '・' + curStage.name : ''}${isClearedAlready ? '（複習）' : ''}`;
    uiStageTagEl.className = `stage-badge ${isClearedAlready ? 'repeat-tag' : ''} ${boss ? 'boss-tag' : ''}`;

    const baseHp = palace.grammar ? 90 : 70 + (currentPalaceIdx * 25);
    enemyMaxHp = Math.round(baseHp * (boss ? 1.5 : 1));
    enemyCurHp = enemyMaxHp;
    updateEnemyHpUI();

    arenaBgEl.style.backgroundImage = `url("${palace.bg}")`;
    enemyAvatarEl.src = monsterImg(palace, stageIdx);
    enemyAvatarEl.classList.toggle("boss", boss);
    comboCount = 0;

    const g = !!palace.grammar;
    wordPanelEl.hidden = g;
    poolAreaEl.hidden = g;
    wordPanelEl.style.display = g ? "none" : "";
    poolAreaEl.style.display = g ? "none" : "";
    grammarPanelEl.hidden = !g;
    grammarQueue = [];
    nextChallenge();
    renderStageDrawer();
    runToStage(token, boss);
  }

  // 下一個題目：單字關重新打亂字母；文法關換下一題
  function nextChallenge() {
    if (curStage.unit) buildGrammarQuestion();
    else buildPuzzle();
  }

  function updateEnemyHpUI() {
    const pct = Math.max(0, (enemyCurHp / enemyMaxHp) * 100);
    enemyHpBarEl.style.width = pct + "%";
    enemyHpTextEl.innerText = `${enemyCurHp} / ${enemyMaxHp}`;
  }

  function buildPuzzle() {
    puzzleCnEl.innerText = curStage.ch;
    puzzleSlotsEl.innerHTML = "";
    poolGridEl.innerHTML = "";
    hintLineEl.innerText = "";
    inputLetters = [];
    wrongAtPos = 0;

    // 建立插槽
    for (let i = 0; i < curStage.word.length; i++) {
      const slot = document.createElement("div");
      slot.className = "slot" + (i === 0 ? " active" : "");
      slot.onclick = () => onSlotClick(i);
      puzzleSlotsEl.appendChild(slot);
    }

    // 混淆字母
    let letters = curStage.word.split("");
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    letters.push(alphabet[Math.floor(Math.random() * 26)]);
    letters.push(alphabet[Math.floor(Math.random() * 26)]);
    letters = shuffle(letters);

    letters.forEach((char) => {
      const btn = document.createElement("button");
      btn.className = "letter-key";
      btn.innerText = char;
      btn.onclick = () => onLetterPressed(btn, char);
      poolGridEl.appendChild(btn);
    });
  }

  function onLetterPressed(btn, char) {
    if (inputLocked) return;
    const targetChar = curStage.word[inputLetters.length];

    if (char === targetChar) {
      playSynth(420 + (inputLetters.length * 80), "sine", 0.08, 0.12);
      btn.classList.add("used");

      const targetSlot = puzzleSlotsEl.children[inputLetters.length];
      targetSlot.innerText = char;
      targetSlot.classList.add("filled");
      targetSlot.classList.remove("active");

      inputLetters.push({ char, btnRef: btn });
      wrongAtPos = 0;
      hintLineEl.innerText = "";

      if (inputLetters.length < curStage.word.length) {
        puzzleSlotsEl.children[inputLetters.length].classList.add("active");
      } else {
        inputLocked = true;
        setTimeout(executeAttack, 100);
      }
    } else {
      playSynth(150, "sawtooth", 0.25, 0.2);
      comboCount = 0;
      wrongAtPos++;
      monsterCounter();
      showWordHint(targetChar);
    }
  }

  // 拼錯的提示：第 1 次念單字給你聽，第 2 次直接亮出下一個字母
  function showWordHint(targetChar) {
    if (wrongAtPos === 1) {
      hintLineEl.innerText = "💡 提示：聽聽看發音，再想想下一個字母";
      speakWord(curStage.word);
    } else {
      hintLineEl.innerText = `💡 提示：下一個字母是「${targetChar}」`;
      const key = Array.from(poolGridEl.children).find(b => !b.classList.contains("used") && b.innerText === targetChar);
      if (key) {
        key.classList.remove("glow");
        void key.offsetWidth;
        key.classList.add("glow");
      }
    }
  }

  function onSlotClick(index) {
    if (inputLocked) return;
    if (index === inputLetters.length - 1 && inputLetters.length > 0) {
      const popped = inputLetters.pop();
      popped.btnRef.classList.remove("used");
      const slot = puzzleSlotsEl.children[index];
      slot.innerText = "";
      slot.classList.remove("filled");
      slot.classList.add("active");
      if (puzzleSlotsEl.children[index + 1]) {
        puzzleSlotsEl.children[index + 1].classList.remove("active");
      }
    }
  }

  // 怪物反擊：答錯時衝向勇者
  function monsterCounter() {
    const h = centerOf(heroImgEl);
    juice.lunge(enemyAvatarEl, -(arenaEl.clientWidth * 0.18));
    setTimeout(() => {
      juice.flash(heroImgEl, "red");
      juice.knockback(heroImgEl, -1);
      juice.floatText(fxEl, h.x, h.y - 20, "MISS", "ouch");
      juice.shake(arenaEl, 0.7);
    }, 220);
  }

  async function executeAttack() {
    speakWord(curStage.unit ? curQ.a : curStage.word);
    comboCount++;

    let dmg = playerWeapon.atk + (comboCount * 6);
    enemyCurHp = Math.max(0, enemyCurHp - dmg);
    const crit = comboCount >= 3;

    // 武器耐久扣除
    if (playerWeapon.durability !== Infinity) {
      playerWeapon.durability--;
      if (playerWeapon.durability <= 0) {
        playerWeapon = { name: "初心木劍", atk: 20, durability: Infinity };
        alert("⚠️ 鍛造武器耐久耗盡！換回了初心木劍！");
        refreshHero();
      }
      updateWeaponDisplay();
      saveGameProgress();
    }

    // 勇者衝刺斬擊
    const m = centerOf(enemyAvatarEl);
    const lunge = juice.lunge(heroImgEl, arenaEl.clientWidth * 0.32);
    await sleep(220);
    playSynth(600, "square", 0.15, 0.2);
    juice.sparks(fxEl, m.x, m.y, HIT_IMG);
    juice.floatText(fxEl, m.x, m.y - 30, `-${dmg}` + (comboCount > 1 ? ` 🔥x${comboCount}` : ""), crit ? "crit" : "dmg");
    juice.flash(enemyAvatarEl, "white");
    juice.knockback(enemyAvatarEl, 1, crit ? 1.4 : 1);
    juice.shake(arenaEl, crit ? 1.3 : 1);
    updateEnemyHpUI();
    await lunge;
    await sleep(250);

    if (enemyCurHp <= 0) {
      await juice.defeat(enemyAvatarEl, fxEl);
      handleVictoryOutcome();
    } else {
      // 未擊死則換題繼續
      nextChallenge();
      inputLocked = false;
      if (curStage.unit) speakWord(curQ.q);
    }
  }

  /* ========================================================
     8. 文法神殿：聽問句、選出正確回答（中文答錯或按提示才出現）
     ======================================================== */
  const qEnEl = document.getElementById("q-en");
  const qHintEl = document.getElementById("q-hint");
  const qOptionsEl = document.getElementById("q-options");

  function buildGrammarQuestion() {
    if (!grammarQueue.length) grammarQueue = shuffle(curStage.unit.items);
    const [q, qzh, a, azh, wrongs] = grammarQueue.pop();
    curQ = { q, qzh, a };
    const opts = shuffle([{ en: a, zh: azh, ok: true }].concat(
      shuffle(wrongs).slice(0, 2).map(([en, zh]) => ({ en, zh, ok: false }))));
    qEnEl.innerText = q;
    qHintEl.innerText = "";
    qOptionsEl.innerHTML = "";
    opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span class="letter">${"ABC"[i]}</span><span><span class="en"></span><span class="zh" hidden></span></span>`;
      b.querySelector(".en").innerText = o.en;
      b.querySelector(".zh").innerText = o.zh;
      b.onclick = () => onOption(b, o);
      qOptionsEl.appendChild(b);
    });
  }

  function revealOptionChinese() {
    qOptionsEl.querySelectorAll(".zh").forEach(z => { z.hidden = false; });
  }

  function onOption(btn, o) {
    if (inputLocked || btn.disabled) return;
    if (o.ok) {
      inputLocked = true;
      btn.classList.add("right");
      qOptionsEl.querySelectorAll(".opt").forEach(b => { b.disabled = true; });
      revealOptionChinese();
      playSynth(660, "sine", 0.12, 0.15);
      setTimeout(executeAttack, 350);
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;
      comboCount = 0;
      playSynth(150, "sawtooth", 0.25, 0.2);
      monsterCounter();
      // 答錯的提示：告訴你題目的意思，並顯示每個選項的中文
      qHintEl.innerText = `💡 提示：題目的意思是「${curQ.qzh}」`;
      revealOptionChinese();
    }
  }

  document.getElementById("btn-say-q").onclick = () => { if (curQ) speakWord(curQ.q); };
  document.getElementById("btn-say-word").onclick = () => { if (curStage && curStage.word) speakWord(curStage.word); };

  /* ========================================================
     9. 結算：首通掉落 vs 複習重刷無掉落
     ======================================================== */
  const lootModalEl = document.getElementById("loot-modal");
  const chestClickerEl = document.getElementById("chest-clicker");
  const chestTipEl = document.getElementById("chest-tip");
  const lootDetailsEl = document.getElementById("loot-details");
  const repeatClearDetailsEl = document.getElementById("repeat-clear-details");
  const lootWordTitleEl = document.getElementById("loot-word-title");
  const lootWordCnEl = document.getElementById("loot-word-cn");
  const repeatWordTitleEl = document.getElementById("repeat-word-title");
  const btnNextRound = document.getElementById("btn-next-round");
  const btnRepeatNext = document.getElementById("btn-repeat-next");

  // 文法關的掉落：從題庫隨機抽一個單字素材
  function randomVocabLoot() {
    const all = (window.GAME_DATA ? GAME_DATA.vocab : []).flatMap(l => l.words || []);
    const w = all[Math.floor(Math.random() * all.length)] || ["star", "星星"];
    return { word: w[0].toUpperCase(), ch: w[1] };
  }

  function handleVictoryOutcome() {
    lootModalEl.style.display = "flex";
    const isFirstTime = !clearedStageKeys.has(curStage.id);

    if (isFirstTime) {
      // 首通：顯示寶箱可開出新單字素材
      pendingLoot = curStage.unit ? randomVocabLoot() : { word: curStage.word, ch: curStage.ch };
      chestClickerEl.style.display = "block";
      chestTipEl.style.display = "block";
      lootDetailsEl.style.display = "none";
      repeatClearDetailsEl.style.display = "none";
    } else {
      // 複習重刷：無寶箱，提示已獲取過獎勵
      chestClickerEl.style.display = "none";
      chestTipEl.style.display = "none";
      lootDetailsEl.style.display = "none";
      repeatClearDetailsEl.style.display = "block";
      repeatWordTitleEl.innerText = curStage.unit ? `📜 ${curStage.name}` : `${curStage.word} (${curStage.ch})`;
      playSynth(520, "triangle", 0.3, 0.2);
    }
  }

  // 首通點擊開箱
  chestClickerEl.onclick = () => {
    playSynth(880, "triangle", 0.4, 0.25);
    chestClickerEl.style.display = "none";
    chestTipEl.style.display = "none";
    lootDetailsEl.style.display = "block";

    // 獲得單字素材卡
    wordBag.push(pendingLoot);
    clearedStageKeys.add(curStage.id);

    lootWordTitleEl.innerText = pendingLoot.word;
    lootWordCnEl.innerText = pendingLoot.ch;

    saveGameProgress();
    updateInventoryDisplay();
    updatePalaceProgressBar();
    refreshHero("首通掉落累積了戰功，勇者換上新裝備！");
  };

  btnNextRound.onclick = () => advanceToNextStage(true);
  btnRepeatNext.onclick = () => advanceToNextStage(false);

  function advanceToNextStage(wasFirstTime) {
    lootModalEl.style.display = "none";
    const palace = PALACES[currentPalaceIdx];

    // 檢查本宮殿是否全部通關
    const unfinishedIndex = palace.stages.findIndex(s => !clearedStageKeys.has(s.id));
    if (unfinishedIndex === -1 && wasFirstTime) {
      if (currentPalaceIdx < PALACES.length - 1) {
        alert(`🏆 壯舉！你已徹底消滅【${palace.name}】的所有試煉！\n即刻啟程前往：${PALACES[currentPalaceIdx + 1].name}`);
        switchPalace(currentPalaceIdx + 1);
        return;
      } else {
        alert("👑 神蹟！你已經完全攻破所有的記憶宮殿殿堂！");
      }
    }

    // 自動前往下一個關卡
    if (currentStageIdx + 1 < palace.stages.length) {
      currentStageIdx++;
    } else {
      findNextAvailableStageInPalace();
    }
    loadStage(currentStageIdx);
  }

  /* ========================================================
     10. 鐵砧鍛造工坊
     ======================================================== */
  const inventoryCardsEl = document.getElementById("inventory-cards");
  const uiBagCountEl = document.getElementById("ui-bag-count");
  const forgePreviewBoxEl = document.getElementById("forge-preview-box");
  const forgeExecBtn = document.getElementById("forge-exec-btn");

  function updateInventoryDisplay() {
    uiBagCountEl.innerText = wordBag.length;
    inventoryCardsEl.innerHTML = "";

    wordBag.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "word-card" + (forgeCandidateIdx === index ? " picked" : "");
      card.innerHTML = `
        <div class="card-w">${item.word}</div>
        <div class="card-ch">${item.ch}</div>
        <div style="font-size:0.75rem; color:var(--gold);">⚡ 傷害: +${item.word.length * 15}</div>
      `;
      card.onclick = () => pickWordForForge(index);
      inventoryCardsEl.appendChild(card);
    });
  }

  function pickWordForForge(index) {
    forgeCandidateIdx = index;
    const target = wordBag[index];
    const power = target.word.length * 15;
    const t = Math.max(clearTier(), weaponTier({ atk: power, durability: 5 }));
    forgePreviewBoxEl.innerHTML = `
      <img src="assets/rpg/hero-${t}.webp" alt="">
      <div style="color:var(--gold); font-size:1.1rem; font-weight:800;">${target.word} 聖劍</div>
      <div style="font-size:0.8rem; color:#ccc;">基礎傷害: +${power} | 耐久: 5 次揮擊</div>
      <div style="font-size:0.8rem; color:#ffcf4a;">裝備後造型：${HERO_LV[t]}</div>
    `;
    forgeExecBtn.disabled = false;
    updateInventoryDisplay();
  }

  forgeExecBtn.onclick = () => {
    if (forgeCandidateIdx === null) return;
    const usedWord = wordBag[forgeCandidateIdx];

    playerWeapon = {
      name: `${usedWord.word} 聖劍`,
      atk: usedWord.word.length * 15,
      durability: 5
    };

    playSynth(240, "sawtooth", 0.45, 0.3);

    // 鍛造後單字永久消耗消失
    wordBag.splice(forgeCandidateIdx, 1);
    forgeCandidateIdx = null;
    forgePreviewBoxEl.innerHTML = `<span style="font-size:0.85rem; color:#888;">請在下方背包選擇單字素材</span>`;
    forgeExecBtn.disabled = true;

    saveGameProgress();
    updateInventoryDisplay();
    updateWeaponDisplay();
    const before = shownTier;
    refreshHero(`鍛造出【${playerWeapon.name}】！攻擊力 ${playerWeapon.atk}，可揮擊 5 次`);
    if (heroTier() <= before) {
      alert(`⚒️ 鍛造成功！打造出【${playerWeapon.name}】！\n💥 攻擊力: ${playerWeapon.atk}\n⏳ 可揮擊: 5 次（用完將回歸木劍）`);
    }
  };

  function updateWeaponDisplay() {
    document.getElementById("ui-weap-name").innerText = playerWeapon.name;
    document.getElementById("ui-weap-atk").innerText = playerWeapon.atk;
    document.getElementById("ui-weap-dur").innerText =
      playerWeapon.durability === Infinity ? "∞" : `${playerWeapon.durability}次`;
  }

  /* ========================================================
     11. 底部場景導覽切換
     ======================================================== */
  const navBtnFight = document.getElementById("nav-btn-fight");
  const navBtnGrammar = document.getElementById("nav-btn-grammar");
  const navBtnForge = document.getElementById("nav-btn-forge");
  const battleSceneEl = document.getElementById("battle-scene");
  const forgeSceneEl = document.getElementById("forge-scene");
  let forgeOpen = false;

  function updateNavActive() {
    navBtnFight.classList.toggle("active", !forgeOpen && currentPalaceIdx !== GRAMMAR_IDX);
    navBtnGrammar.classList.toggle("active", !forgeOpen && currentPalaceIdx === GRAMMAR_IDX);
    navBtnForge.classList.toggle("active", forgeOpen);
  }

  function showBattle() {
    forgeOpen = false;
    battleSceneEl.style.display = "flex";
    forgeSceneEl.style.display = "none";
  }

  navBtnFight.onclick = () => {
    const wasForge = forgeOpen;
    showBattle();
    if (currentPalaceIdx === GRAMMAR_IDX) switchPalace(lastWordPalaceIdx);
    else if (wasForge) updateNavActive();
  };

  navBtnGrammar.onclick = () => {
    const wasForge = forgeOpen;
    showBattle();
    if (currentPalaceIdx !== GRAMMAR_IDX) switchPalace(GRAMMAR_IDX);
    else if (wasForge) updateNavActive();
  };

  navBtnForge.onclick = () => {
    forgeOpen = true;
    battleSceneEl.style.display = "none";
    forgeSceneEl.style.display = "flex";
    updateNavActive();
  };

  // 實體鍵盤：單字關打字母、Backspace 退回；文法關按 1/2/3 或 A/B/C
  window.addEventListener("keydown", (e) => {
    if (forgeOpen || inputLocked) return;
    if (lootModalEl.style.display === "flex" || evolveModalEl.style.display === "flex") return;
    if (curStage.unit) {
      const i = "123".indexOf(e.key) >= 0 ? "123".indexOf(e.key) : "ABC".indexOf(e.key.toUpperCase());
      const b = qOptionsEl.children[i];
      if (e.key.length === 1 && i >= 0 && b) b.click();
      return;
    }
    const key = e.key.toUpperCase();
    if (key.length === 1 && key >= "A" && key <= "Z") {
      const free = Array.from(poolGridEl.children).filter(b => !b.classList.contains("used"));
      // 同一個字母有好幾顆時，優先按「現在要的那一顆」
      const matchBtn = free.find(b => b.innerText === key && key === curStage.word[inputLetters.length])
        || free.find(b => b.innerText === key);
      if (matchBtn) matchBtn.click();
    } else if (e.key === "Backspace") {
      e.preventDefault();
      if (inputLetters.length > 0) onSlotClick(inputLetters.length - 1);
    }
  });

  /* ========================================================
     12. 啟動
     ======================================================== */
  loadGameSave();
  setupChapterDropdown();
  updateInventoryDisplay();
  updateWeaponDisplay();
  shownTier = heroTier();
  refreshHero();
  updateNavActive();
  findNextAvailableStageInPalace();
  loadStage(currentStageIdx);
</script>
<script src="https://kuog88.github.io/home-button.js" defer></script>
</body>
</html>
