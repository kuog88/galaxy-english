<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單字勇者：記憶宮殿鍛造記</title>
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
<div id="game">
  <header>
    <select class="grade" id="grade" title="選擇年級"></select>
    <span class="chip" id="chip-stage" title="關卡清單">🗺️ <b id="stage-num">1-1</b></span>
    <span class="chip" id="chip-points" title="解鎖點數">⭐ <b id="points">0</b></span>
    <span class="chip" id="chip-sound" title="聲音開關">🔊</span>
  </header>

  <!-- 冒險 -->
  <section class="scene" id="scene-battle">
    <div class="field" id="field">
      <div class="field-bg" id="field-bg"></div>
      <div class="stage-tag" id="stage-tag"></div>
      <div class="monsters" id="monsters"></div>
      <div class="partyrow" id="partyrow"></div>
      <div class="fx" id="fx"></div>
    </div>
    <div class="console win" id="console"></div>
  </section>

  <!-- 鍛造屋 -->
  <section class="scene" id="scene-forge" hidden><div class="page" id="forge-page"></div></section>

  <!-- 酒館（角色） -->
  <section class="scene" id="scene-bar" hidden><div class="page" id="bar-page"></div></section>

  <div class="modal" id="modal"><div class="win" id="modal-box"></div></div>

  <nav>
    <button id="nav-battle" class="active">⚔️ 冒險</button>
    <button id="nav-forge">🔥 鍛造屋</button>
    <button id="nav-bar">🍺 夥伴</button>
  </nav>
</div>

<script src="js/hero/data.js"></script>
<script src="js/rpg/juice.js"></script>
<script src="js/hero/game.js"></script>
<script src="https://kuog88.github.io/home-button.js" defer></script>
</body>
</html>
